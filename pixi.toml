[workspace]
name = "opengwasdb-stores"
description = "Registry, generators, and reference-resource tooling for opengwasdb-stores"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]
version = "0.1.0"

# See docs/software-management-proposal.md for the design behind this file.
# The sole user-facing execution interface is `pixi run <task>`.

# ---------------------------------------------------------------------------
# Features
# ---------------------------------------------------------------------------

[feature.python.dependencies]
python = "3.11.*"
pip = "*"
numpy = ">=1.26,<2.5"
scipy = ">=1.11"
pyyaml = "*"

[feature.store-build.dependencies]
pandas = ">=2.0"
scikit-learn = ">=1.3"
zarr = ">=2.18,<3"
numcodecs = ">=0.12,<0.13"
typer = ">=0.12"
pyliftover = ">=0.4"
threadpoolctl = ">=3.0"

[feature.store-build.pypi-dependencies]
# Immutable pin (issue #41): a released version should replace this Git pin
# once one exists. Do not float this to a branch. pysam is left off the conda
# dependency list on purpose: opengwasdb's own PyPI dependency on it collides
# (conda + PyPI wheel installing the same compiled extension into the same
# environment) if pysam is also pinned via conda, so it is left for pip/uv to
# resolve as a transitive PyPI dependency of opengwasdb itself.
#
# Bumped for issue #51: explodecomputer/opengwasdb#16 ("Add analyses.tsv
# schema module") published opengwasdb.model.analyses (validate_analyses(),
# to_json_schema()) -- the shared core schema this registry's checks.schema
# validates emitted manifests against, replacing this repository's
# hand-rolled per-generator column-name checks. This pin is opengwasdb's
# main HEAD at the time of the bump, which also carries #17-#19's
# manifest-authority/reader-capability/SD-estimator work (ADR-0012-owned
# statistical logic) issue #15's breakdown depends on.
opengwasdb = { git = "https://github.com/explodecomputer/opengwasdb", rev = "197a77c499b013cf9c45c6b920715bca740f5a4e" }

[feature.r.dependencies]
r-base = ">=4.3"
"r-data.table" = "*"
r-yaml = "*"
# data.table::fread() shells out to R.utils to read .gz files directly; never
# library()'d explicitly, so it's easy to miss auditing only `library()` calls.
"r-r.utils" = "*"
# Needed by resources/lib/metadata_resolvers/opengwas_api.R's
# fetch_opengwas_gwasinfo() (issue #49) to call the live OpenGWAS API; the
# tested resolve_opengwas_api_metadata() itself has no network dependency.
r-httr = "*"
r-jsonlite = "*"
r-ieugwasr = ">=1.1.0,<2"

[feature.reporting.dependencies]
r-dplyr = "*"
r-ggplot2 = "*"
r-knitr = "*"
r-scales = "*"
r-tibble = "*"
r-tidyr = "*"
r-jsonlite = "*"
r-curl = "*"
r-dt = "*"
r-tidyverse = "*"
quarto = "*"

[feature.ld-panel.dependencies]
plink2 = "*"
bcftools = "*"
curl = "*"

[feature.dev.dependencies]
git = "*"
gh = "*"
sqlite = "*"

# ---------------------------------------------------------------------------
# Environments
# ---------------------------------------------------------------------------
# Solve groups keep shared packages (numpy, r-data.table, ...) at one resolved
# version across environments instead of letting each environment solve
# independently, so "tested" and "production" stay the same build.

[environments]
default = { features = ["python", "store-build", "r"], solve-group = "main" }
docs = { features = ["r", "reporting"], solve-group = "main" }
ld-panel = { features = ["python", "ld-panel"], solve-group = "main" }
dev = { features = ["python", "store-build", "r", "reporting", "ld-panel", "dev"], solve-group = "main" }

# ---------------------------------------------------------------------------
# Tasks
# ---------------------------------------------------------------------------

[feature.dev.tasks]
test = { cmd = "python3 resources/scripts/run_all_tests.py" }
test-python = { cmd = "python3 resources/scripts/run_all_tests.py --only python" }
test-r = { cmd = "python3 resources/scripts/run_all_tests.py --only r" }
env-check = { cmd = "python3 resources/scripts/env_check.py" }

[feature.reporting.tasks]
docs = { cmd = "bash resources/scripts/build-site.sh" }
# The full `docs` task needs raw GWAS Catalog source data that is not tracked
# in this repository (resources/data/*.tsv, "download separately" per
# .gitignore) to build ebi-studies.qmd/make-dashboard.r's inputs. docs-smoke
# renders only beta-scale-estimation.qmd, which is fully self-contained (no
# external data reads), so it is safe to run from a bare checkout — this is
# what CI uses as its documentation smoke test.
docs-smoke = { cmd = "quarto render resources/scripts/beta-scale-estimation.qmd --to html" }

[feature.ld-panel.tasks]
ld-acquire = { cmd = "python3 resources/scripts/ld-panel/acquire_hgdp1kgp.py" }
ld-materialize = { cmd = "python3 resources/scripts/ld-panel/materialize_reference.py" }
