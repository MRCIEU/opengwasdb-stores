label: eQTLGen consortium cis-eQTL meta-analysis (2019)
provider: eQTLGen Consortium
source_format: besd
source_reader_capability: null
access_posture: public
default_license: eQTLGen Consortium data use terms
description: >
  Genome-wide whole-blood cis-eQTL summary statistics from the eQTLGen
  Consortium's 2019 meta-analysis (31,684 samples), distributed as one BESD
  triple (.esi/.epi/.besd, SPARSE_FILE_TYPE_3) covering all ~19,250 tested
  probes/genes on GRCh37. Unlike this registry's other Source Collections,
  BESD is not read through opengwasdb's SourceReader capability registry --
  `opengwasdb.layouts.ragged.build_besd.build_ragged_from_besd()` reads a
  `.esi`/`.epi`/`.besd` triple directly and derives one Analysis per probe
  from the `.epi` file itself, so `source_reader_capability` is null here.
