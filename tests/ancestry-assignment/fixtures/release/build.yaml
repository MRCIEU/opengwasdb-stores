store_family_id: fixture-ancestry-assignment
family_release_id: fixture-release
store_layout: ragged-observed
completion_state: observed-only
builder:
  package: opengwasdb
  entrypoint: opengwasdb.layouts.ragged.build_ssf:build_ragged_from_ssf
source:
  source_format: gwas-ssf
  source_reader_capability: opengwasdb.gwas-ssf
  source_genome_build: GRCh38
normalisation:
  target_reference_assembly: GRCh38
  liftover: ~
effects:
  stored_effect_scale: sd
shape:
  association_coverage: unknown
  ragged_region_policy: ~
reference_resources:
- resource_id: fixture-ancestry-mixture
  kind: ancestry_mixture
  genome_build: GRCh38
  location: tests/ancestry-assignment/fixtures/reference/ref_freqs.hg38.tsv.gz
  fine_group_map: tests/ancestry-assignment/fixtures/reference/ancestry_groups.tsv
ancestry_assignment:
  enabled: yes
  reference_resource_id: fixture-ancestry-mixture
  maf_floor: 0.01
  gates:
    tau: 0.50
    delta: 0.20
    n_min: 10
    residual_max: 0.06
validation:
  required: yes
artifacts:
  filtered_dir: tests/ancestry-assignment/fixtures/release/filtered
