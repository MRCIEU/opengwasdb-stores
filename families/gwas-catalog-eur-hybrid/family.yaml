store_family_id: gwas-catalog-eur-hybrid
label: GWAS Catalog European-ancestry Hybrid store (pooled across publications)
source_collection_id: gwas-catalog-ssf
access_posture: public
release_cadence: one-off
description: >
  European-ancestry Hybrid store pooling harmonised GWAS-SSF Analyses across
  many independent GWAS Catalog publications that don't individually meet the
  single-publication Dense/Ragged size threshold (resources/scripts/ebi-studies.r's
  "everything left over" store_type assignment) -- 6,035 candidate Analyses
  spanning 1,007 distinct PMIDs (store_key hybrid__European in
  resources/data/derived/store-candidates-analyses.tsv). First worked example
  of a Hybrid-layout generator and the end-to-end proof of the
  GWAS-SSF -> Hybrid pipeline via opengwasdb's GWAS-SSF Source Reader
  Capability (opengwasdb#84) and its Dense/Hybrid liftover fix (opengwasdb#85).
query_promise:
  coverage: full-gwas
  expected_layouts:
    - hybrid-observed
priority:
  value: medium
  readiness: medium
  rationale: >
    Proves the Hybrid layout (dense on-panel fill + ragged off-panel overflow,
    opengwasdb's ADR 0026) end to end on real, diverse GWAS-Catalog-SSF data -- the last of
    the five source-format/layout combinations identified as needing a
    grounded pilot. `eur-hybrid-prioritise.r` already curates the full
    6,035-Analysis pool for later production sizing; this family starts at
    pilot scale (10 Analyses) rather than the full pool, which
    store-candidates-summary.tsv estimates at ~181 GB reference-completed.
