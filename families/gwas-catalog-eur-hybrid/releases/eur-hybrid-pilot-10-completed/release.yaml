notes: |
  --ancestry European (not the panel's own EUR directory name) is required here because this Store Family's assigned_ancestry column is populated with the free-text label "European", not the ISO/continental code "EUR" -- opengwasdb's ancestry-match filter (opengwasdb.completion.ancestry_filter.derive_impute_analysis_ids) does an exact string match with no vocabulary translation, so passing --ancestry EUR against this Family silently imputed 0 Analyses on a first attempt (all completion work was really happening per-block, but every Analysis was filtered out of the impute set). Filed as opengwasdb#98. Worked around here, not by renaming this Family's ancestry labels, but by adding a `European -> EUR` symlink under the LD panel root so the CLI's --ancestry argument and this Family's real assigned_ancestry values agree; the panel data itself is unchanged (still the real EUR reference).

  This release exercises the one non-trivial Hybrid-completion bug found and fixed this session: LD-panel extension can cross a real observed off-panel (Ragged Overflow) association onto the newly-extended Dense panel, which -- before the fix -- left the store violating its own disjoint-partition invariant (opengwasdb#99, fixed in opengwasdb@553aee3). This build (the fixed re-run) folded 2,723,489 such crossover associations into the Dense Component as real observations, 2,687,338 of which had already been LD-imputed there and are now corrected to the real value. `opengwasdb validate` reports valid.

  From the built manifest: 22,809,242 shared variants (12,719,981 on-panel + 10,089,261 off-panel), 33,037,123 imputed dense cells (post-fold), 25,087,345 Ragged Overflow associations (observed-only, post-fold). Inherits eur-hybrid-pilot-10's known opengwasdb#86 gap (sample_size_kind/sample_size_scope/original_effect_scale dropped from the built Analysis metadata, ancestry_assignment_method fabricated as af_assigned) -- unresolved upstream, unaffected by completion.

  A Dense Rho Matrix was built for this completed store's Dense Component (opengwasdb build-dense-rho .../dense, n_workers=32).

  The pre-fix broken build (which failed validate_store with "disjoint-partition violated") was kept at hybrid__European__pilot10-cc-completed-broken-pre99fix alongside this store for reference, pending deletion.
