store_family_id: gwas-catalog-eur-hybrid
family_release_id: eur-hybrid-quant-pilot-10-completed
store_layout: hybrid-reference-completed
completion_state: reference-completed
builder:
  package: opengwasdb
  entrypoint: "opengwasdb.layouts.hybrid.complete:complete_hybrid_store"
source:
  source_format: gwas-ssf
  source_reader_capability: opengwasdb.gwas-ssf
  source_genome_build: GRCh38
normalisation:
  target_reference_assembly: GRCh38
  liftover: ~
  source_assembly: hg38
effects:
  stored_effect_scale: sd
shape:
  association_coverage: full_gwas
reference_resources:
- resource_id: hybrid-ieua-dense-panel
  kind: hybrid_dense_panel
  ancestry: ~
  genome_build: GRCh38
  variant_id_convention: "chr:pos:A1:A2 (A1 = min(allele1, allele2))"
  allele_columns: ~
  location: /data/opengwasdb/wip/hybrid-ieua/panel_alids.txt
  location_kind: external_file
  fine_group_map: ~
- resource_id: ukb-hg38-eur-af
  kind: reference_af
  ancestry: European
  genome_build: GRCh38
  variant_id_convention: "chr:pos_ref_alt"
  allele_columns:
    effect: EA
    other: OA
    freq: EAF
  location: /data/opengwasdb/reference/ukb-hg38
  location_kind: external_directory
  fine_group_map: ~
- resource_id: hgdp1kgp-hg38-eur-ld
  kind: ld_panel
  ancestry: EUR
  genome_build: GRCh38
  variant_id_convention: "chr:pos:A1:A2 (A1 = min(allele1, allele2))"
  location: /data/opengwasdb/reference/hgdp1kgp-hg38/panel/EUR
  location_kind: external_directory
validation:
  required: yes
artifacts:
  artifact_root: /data/opengwasdb
  release_subdir: gwas-catalog-eur-hybrid/releases/eur-hybrid-quant-pilot-10
  download_dir: /data/opengwasdb/gwas-catalog-eur-hybrid/releases/eur-hybrid-quant-pilot-10/download
  store_uri: /data/opengwasdb/gwas-catalog-eur-hybrid/releases/eur-hybrid-quant-pilot-10/store/hybrid__European__pilot10-quant-completed
  build_log_uri: ~
notes: |
  --ancestry European used at the CLI, resolved onto the real EUR panel directory via a symlink workaround for opengwasdb#98. Rho Matrix built on the Dense Component (.../store/.../dense).
