notes: |
  Pilot release for issue #27. No single encoding gene per metabolite, so this uses the no-cis sparse-region policy (issue #26): only significant-hit and suggestive-lead regions are retained, no cis window. Unlike the Sun pQTL pilot, this Source Collection's harmonised files carry genuine source allele frequencies, so effect-scale validation runs with af_source=source and ancestry assignment runs with real AF-based mixture fitting across four distinct ancestries (issue #23/#25).
