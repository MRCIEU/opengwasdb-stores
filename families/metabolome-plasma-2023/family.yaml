store_family_id: metabolome-plasma-2023
label: Multi-ancestry plasma metabolome atlas (Chen et al. 2023)
source_collection_id: gwas-catalog-ssf
access_posture: public
release_cadence: one-off
description: >
  Ragged signals-only (no cis window) plasma metabolome mQTL store spanning
  African, East Asian, European, and South Asian ancestries (Chen et al.
  2023, PMID 36635386, Nat Genet), built from harmonised GWAS-SSF via the
  shared `gwas-ssf-ragged` generator's no-cis sparse-region policy. First
  worked example of reference-AF effect-scale validation with real
  source-provided allele frequencies (`af_source: source`) and the first
  worked example of AF-based ancestry assignment (`af_assigned`), exercised
  across four distinct ancestries in one release.
query_promise:
  coverage: signals_only
  expected_layouts:
    - ragged-observed
priority:
  value: high
  readiness: high
  rationale: >
    Proves the no-cis sparse-region policy (issue #26) and AF-based ancestry
    assignment (issue #23/#25) end to end on real multi-ancestry data with
    genuine source allele frequencies, complementing the single-ancestry,
    no-source-AF Sun pQTL pilot.
