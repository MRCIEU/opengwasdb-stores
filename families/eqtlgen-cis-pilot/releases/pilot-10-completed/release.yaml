  Completion adds no new Analyses -- analyses.tsv here is unchanged from pilot-10, repeated per the release-bundle convention (self-contained bundles). LD reference completion parameters: min_cor 0.7, pca_thresh 0.9 (opengwasdb defaults), ancestry EUR (a direct match -- eqtlgen's donors are the eQTLGen Consortium's whole-blood EUR meta-analysis cohort, no ancestry-approximation caveat needed here, unlike finngen-r13-completed).

