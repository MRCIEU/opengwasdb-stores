store_family_id: eqtlgen-cis-pilot
label: eQTLGen cis-eQTL pilot (BESD -> Ragged)
source_collection_id: eqtlgen-cis
access_posture: public
release_cadence: one-off
description: >
  Ragged cis-eQTL store for a small, well-known set of genes from the
  eQTLGen Consortium's 2019 whole-blood cis-eQTL meta-analysis, built from a
  real BESD source via opengwasdb's existing `build_ragged_from_besd()`.
  First registry-side BESD -> Ragged pilot (issue #67) and the end-to-end
  proof of the BESD -> Ragged pipeline, mirroring `pqtl-interval-2018`'s
  role for the GWAS-SSF -> Ragged pipeline.
query_promise:
  coverage: cis
  expected_layouts:
    - ragged-observed
priority:
  value: medium
  readiness: high
  rationale: >
    Proves the BESD -> Ragged pipeline end to end using a real, public
    molecular-QTL source and closes the last unstarted cell in Roadmap 2's
    representative store matrix (opengwas/opengwasdb#89).
