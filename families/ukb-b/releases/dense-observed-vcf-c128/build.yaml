store_family_id: ukb-b
family_release_id: dense-observed-vcf-c128
store_layout: dense-observed
completion_state: observed-only
builder:
  package: opengwasdb
  entrypoint: opengwasdb.layouts.dense.build_vcf:build_dense_from_vcf_manifest
source:
  source_format: gwas-vcf
  source_reader_capability: opengwasdb.gwas-vcf
  source_genome_build: GRCh37
normalisation:
  target_reference_assembly: GRCh38
  liftover: hg19-to-hg38
validation:
  required: true
artifacts:
  store_uri: /data/opengwasdb/wip/ukb-b-c128.opengwasdb
  build_log_uri: null
notes: >
  family_release_id here ("dense-observed-vcf-c128") matches the release_id
  actually recorded in the built store's own manifest.json, not the
  "dense-observed-hg38-v1" that explodecomputer/opengwasdb
  data/ukb-b/build.sh currently declares as RELEASE_ID. Either that script
  was edited after this store was built, or a different invocation produced
  the real artifact — worth confirming with whoever ran the original build
  before treating build.sh as authoritative for re-running it.
