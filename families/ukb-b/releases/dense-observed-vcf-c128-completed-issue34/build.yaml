store_family_id: ukb-b
family_release_id: dense-observed-vcf-c128-completed-issue34
store_layout: dense-reference-completed
completion_state: reference-completed
builder:
  package: opengwasdb
  entrypoint: "opengwasdb.layouts.dense.complete:complete_dense_store"
source:
  source_format: gwas-vcf
  source_reader_capability: opengwasdb.gwas-vcf
  source_genome_build: GRCh37
normalisation:
  target_reference_assembly: GRCh38
  liftover: hg19-to-hg38
effects:
  stored_effect_scale: ~
shape:
  association_coverage: full_gwas
reference_resources:
- resource_id: ukb-hg38-eur-ld
  kind: ld_panel
  ancestry: EUR
  genome_build: GRCh38
  variant_id_convention: "chr:pos:A1:A2 (A1 = min(allele1, allele2))"
  location: /data/opengwasdb/reference/ukb-hg38/EUR
  location_kind: external_directory
validation:
  required: true
artifacts:
  store_uri: /data/opengwasdb/stores/ukb-b-c128-completed.opengwasdb
  build_log_uri: /data/opengwasdb/wip/ukb-b-c128-completed.PROVENANCE.md
notes: >
  family_release_id matches the release_id recorded in the built store's own
  manifest.json ("dense-observed-vcf-c128-completed-issue34"), same
  convention as dense-observed-vcf-c128's own release.yaml note.
  reference_resources.resource_id here ("ukb-hg38-eur-ld") is a UKB-specific
  rebuilt LD panel distinct from the shared "hgdp1kgp-hg38-eur-ld" panel used
  by other families in this registry -- see release.yaml notes for the
  opengwasdb-stores#34 rebuild provenance.
