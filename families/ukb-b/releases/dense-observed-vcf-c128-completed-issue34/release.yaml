notes: |
  Built 2026-08-05 08:23-16:06 BST (opengwasdb complete-dense, elapsed 27777.7s) against `/data/opengwasdb/reference/ukb-hg38` / EUR -- a UKB-specific rebuild of the LD panel for opengwasdb-stores issue #34 (601 of 1,357 blocks regenerated at `--cumvar 0.99 --min-k 250`, swapped into production on branch `issue-34-parallel-eigendecomposition-backfill`, commit `37434b4cf25e30effcb2a23a4dcc22719b085047`; displaced originals kept as `*.ldeig-preissue34.npz` alongside the panel, not deleted). Full detail in `/data/opengwasdb/wip/ukb-b-c128-completed.PROVENANCE.md`, which predates and substitutes for this bundle -- this bundle is the first formal Store Family registration of that store.

  From the built manifest's completion provenance: 11,192,757 total variants across the completed union (1,345,056 newly added by the LD panel beyond the 9,847,701-variant build panel), 11,266,156,810 imputed cells, 18,645,778 imputation-failures, 2,766,547,727 left off-panel-missing, across all 2,514 Analyses (EUR, a direct ancestry match -- no approximation caveat). `min_cor=0.7`, `pca_thresh=0.9`.

  Schema migration (2026-08-19, opengwasdb#103): this store's own `analyses.tsv` still carried the pre-ADR-0034 shape (`phenotype_id`/`phenotype_label`, ADR 0034 landed 2026-08-15 after this store was built) and so failed `opengwasdb validate`'s retired-column check. Migrated in place via `scripts/migrate_store_to_analyses_tsv.py`'s new `migrate_analyses_tsv_in_place` path (opengwasdb commit 7e755d1), which recovers each Analysis's real human-readable description from the old `phenotype_label` column into `analysis_label` (this era's `analysis_label` was always just a copy of `analysis_id`, not a resolved label) and preserves the already-correct completion rollups and Top-Hit Counts unchanged. `opengwasdb validate` now reports `valid`.

  `analyses.tsv` here is `dense-observed-vcf-c128`'s own manifest analyses.tsv, unchanged (completion adds no new Analyses; store-only completion-rollup columns are excluded from registry manifests per this registry's own column-class convention, docs/release-metadata-schema.md). It inherits that release's known gap, not newly introduced here: `stored_effect_scale`/`sample_size_kind`/`sample_size_scope`/`sample_size`/`original_effect_scale`/`ancestry_assignment_method`/`n_cases`/`n_controls` are genuinely unresolved for this batch -- `dense-observed-vcf-c128-resolved` exists to fix these at the manifest level (issue #49/#50) but, per its own notes, opengwasdb's VCF-manifest builder never actually consumes manifest-supplied values for these fields (opengwasdb#14, unresolved), so the real built store -- this one included -- still lacks them. See `validation.yaml` for the resulting schema-check failure, which is this pre-existing family-wide gap, not a defect in this release's completion or migration.
