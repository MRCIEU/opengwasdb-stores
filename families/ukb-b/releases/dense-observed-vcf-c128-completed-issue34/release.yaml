description: |
  Reference-Completed sibling of dense-observed-vcf-c128: the same 2,514-Analysis ukb-b Dense Observed-Only Store, reference-completed against a UKB-specific rebuilt hg38 EUR LD panel via opengwasdb's complete_dense_store() (opengwasdb-stores issue #34). Built 2026-08-05; this bundle formally registers it as a Store Release for the first time (previously tracked only by a provenance note, not a release bundle) and migrates its analyses.tsv onto the current schema so opengwasdb validate accepts it again (see notes).

  Status is `built`, not `validated`: the store itself reads back correctly (`opengwasdb validate` reports `valid`), but validation.yaml's schema check genuinely fails -- several required Analytical Metadata columns were never populated for this batch. That is a real, pre-existing gap in this batch's declared metadata (inherited from dense-observed-vcf-c128, not introduced here), deliberately left failing rather than silently accepted, same convention as dense-observed-vcf-pilot-10.
